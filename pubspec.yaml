name: apk_cocktail
description: Pourfolio - descoberta e diario pessoal de cocktails.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.12.2 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  path: ^1.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0
  geolocator: ^14.0.2
  table_calendar: ^3.2.0
  image_picker: ^1.2.0
  uuid: ^4.5.1
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
  assets:
    - assets/icones/
    - assets/imagens/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icones/pourfolio.png
  adaptive_icon_background: "#100D12"
  adaptive_icon_foreground: assets/icones/pourfolio_foreground.png
flutter_native_splash:
  color: "#100D12"
  image: assets/icones/pourfolio_foreground.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#100D12"
    image: assets/icones/pourfolio_foreground.png
